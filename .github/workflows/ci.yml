name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # Integration tests target SQL Server LocalDB, which only ships on the Windows runner image.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # LocalDB is installed on the windows runner image but its default instance is not running,
      # so every integration test failed with SQL error 4060 ("cannot open database") -- which
      # reads like a missing database rather than a stopped server. The same tests pass locally,
      # which is what identified this as an environment gap rather than a code fault.
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb create MSSQLLocalDB -s 2>$null
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      # Detects a finding rather than the absence of a reassuring string: the command
      # prints one line per project, so checking for "has no vulnerable packages" would
      # be satisfied by any single clean project even when another reports advisories.
      # `dotnet list package --vulnerable` also exits 0 either way, so its output is the
      # only signal available. Both the backend and the client are clean as of this
      # change, so this went in green rather than immediately red.
      - name: Check for vulnerable NuGet packages
        shell: bash
        run: |
          report=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found (see the table above)."
            exit 1
          fi
          echo "No vulnerable packages found."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Angular 22's CLI requires Node >= 22.22.3; "20" failed with exit code 3 and the message
          # "The Angular CLI requires a minimum Node.js version". Tracks the latest 22.x rather
          # than pinning a patch, since the CLI states a minimum. Same fix as the active repo.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      # High/Critical only: a moderate transitive advisory in build-only tooling
      # shouldn't block every PR when there's no one triaging lower severities.
      - name: Audit dependencies
        # npm audit exits non-zero for two unrelated reasons: it found an advisory, or it could
        # not reach the registry at all. Treating those alike makes an npm outage look like a
        # security finding -- on 2026-09-04 a burst of 503s from the audit endpoint failed five
        # unrelated dependency PRs across these repos, and a red check that actually means "npm
        # was down" is how a gate gets muted. So retry the transport, fail hard on a real
        # finding, and if the registry stays unreachable say plainly that the audit did not run.
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"
              echo "No High/Critical advisories."
              exit 0
            fi

            if printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|EAI_AGAIN|ECONNRESET|socket hang up'; then
              echo "Could not reach the npm registry (attempt $attempt of 3)."
              sleep $((attempt * 15))
              continue
            fi

            echo "$out"
            echo "::error::npm audit found a High or Critical advisory."
            exit 1
          done

          echo "$out"
          echo "::warning::npm audit could not reach the npm registry after 3 attempts, so dependencies were NOT audited in this run. This is a transport failure, not a clean result."
