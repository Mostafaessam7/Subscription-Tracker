name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # Integration tests target SQL Server LocalDB, which only ships on the Windows runner image.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      # Detects a finding rather than the absence of a reassuring string: the command
      # prints one line per project, so checking for "has no vulnerable packages" would
      # be satisfied by any single clean project even when another reports advisories.
      # `dotnet list package --vulnerable` also exits 0 either way, so its output is the
      # only signal available. Both the backend and the client are clean as of this
      # change, so this went in green rather than immediately red.
      - name: Check for vulnerable NuGet packages
        shell: bash
        run: |
          report=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found (see the table above)."
            exit 1
          fi
          echo "No vulnerable packages found."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      # High/Critical only: a moderate transitive advisory in build-only tooling
      # shouldn't block every PR when there's no one triaging lower severities.
      - name: Audit dependencies
        run: npm audit --audit-level=high
